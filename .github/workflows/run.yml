name: Aegis Community Assistant

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aegis-community-assistant
  cancel-in-progress: false

jobs:
  firestore-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install HTTP client only
        run: python -m pip install 'httpx>=0.27,<1'
      - name: Check Python syntax
        run: python -m py_compile firestore_probe.py
      - name: Read Server 3 channel metadata only
        env:
          PYTHONUNBUFFERED: '1'
          SEND_ENABLED: 'false'
          SESSION_SECONDS: '300'
          POLL_SECONDS: '60'
        run: python -u firestore_probe.py
