name: AI Support Bot

on:
  schedule:
    # Runs every 30 minutes (keeps you safely inside OpenRouter's 50 free requests/day limit)
    - cron: '*/30 * * * *'
  # Lets you trigger a manual test run anytime from the Actions tab
  workflow_dispatch:

jobs:
  run-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install browser-use
          playwright install chromium --with-deps

      - name: Run AI Support Agent
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          SITE_COOKIES: ${{ secrets.SITE_COOKIES }}
        run: python bot.py
