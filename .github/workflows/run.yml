name: Aegis Community Assistant

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aegis-community-assistant
  cancel-in-progress: false

jobs:
  run-agent:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check
      - name: Install Chromium
        run: python -m playwright install chromium --with-deps
      - name: Check Python syntax
        run: python -m py_compile bot.py run_aegis.py
      - name: Run Aegis
        env:
          PYTHONUNBUFFERED: '1'
          ANONYMIZED_TELEMETRY: 'false'
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          SITE_USERNAME: ${{ secrets.SITE_USERNAME }}
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
          GROQ_MODEL: 'openai/gpt-oss-120b'
          SEND_ENABLED: 'false'
          SESSION_SECONDS: '20100'
          POLL_SECONDS: '30'
          PASS_SECONDS: '1200'
          MAX_STEPS: '30'
          GROQ_REQUEST_INTERVAL: '65'
        run: python -u run_aegis.py
