name: Aegis Community Assistant

on:
  workflow_dispatch:
    inputs:
      send_enabled:
        description: 'Reply to fresh @Aegis mentions (unchecked = dry run, no sends)'
        type: boolean
        default: true
        required: true
      open_world:
        description: 'EARLY ACCESS: send Aegis to its own 3D open world instead of chat (unchecked = chat mode)'
        type: boolean
        default: false
        required: false
  # GitHub kills hosted jobs after 6 hours, so the session cannot literally run
  # forever. This daily restart at 02:35 America/Chicago (right after the
  # Firestore daily quota resets) keeps a live session running every day until
  # you disable the workflow. Disable or delete this schedule to stop it.
  schedule:
    - cron: '35 8 * * *'

permissions:
  contents: read

concurrency:
  group: aegis-community-assistant
  cancel-in-progress: false

jobs:
  controlled-reply-test:
    runs-on: ubuntu-24.04
    # GitHub kills hosted jobs after 6 hours; the session runs until you
    # cancel it, the timeout hits, or you stop it another way.
    timeout-minutes: 360
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install HTTP client only
        run: python -m pip install 'httpx>=0.27,<1'
      - name: Check syntax and run offline tests
        run: |
          python -m py_compile firestore_worker.py world_worker.py
          python -m unittest -v test_firestore_worker.py test_world_worker.py
      - name: Watch for @Aegis mentions and reply until stopped
        env:
          PYTHONUNBUFFERED: '1'
          SEND_ENABLED: ${{ (github.event_name == 'schedule') || inputs.send_enabled }}
          AEGIS_MODE: ${{ inputs.open_world == true && 'world' || 'chat' }}
          SITE_USERNAME: ${{ secrets.SITE_USERNAME }}
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: 'openai/gpt-oss-120b'
        run: |
          if [ "$AEGIS_MODE" = "world" ]; then
            echo "Aegis is entering the open world (early access)"
            python -u world_worker.py
          else
            python -u firestore_worker.py
          fi
